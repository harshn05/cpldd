name: Build and Release CPLDD

on:
  push:
    tags:
      - '[0-9]*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build portable CPLDD bundle
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller zstandard

      - name: Build cpldd.exe with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm cpldd_.spec

          if (-not (Test-Path "dist/cpldd.exe")) {
            throw "PyInstaller did not produce dist/cpldd.exe"
          }

          & "dist/cpldd.exe" --help
          if ($LASTEXITCODE -ne 0) {
            throw "cpldd.exe --help smoke test failed"
          }

      - name: Download latest MSYS2 runtime tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          python scripts/fetch_msys2_runtime.py --output-dir package
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 runtime download/extraction failed"
          }

      - name: Assemble and validate cpldd.zip
        shell: pwsh
        run: |
          Copy-Item "dist/cpldd.exe" "package/cpldd.exe"

          # License files are required: the bundled MSYS2 tools are GPL-licensed.
          Copy-Item "LICENSE.md" "package/LICENSE.md"
          Copy-Item "THIRD-PARTY-NOTICES.md" "package/THIRD-PARTY-NOTICES.md"
          Copy-Item "GPL-3.0.txt" "package/GPL-3.0.txt"

          $expected = @(
            "cpldd.exe",
            "cygpath.exe",
            "ldd.exe",
            "msys-2.0.dll",
            "LICENSE.md",
            "THIRD-PARTY-NOTICES.md",
            "GPL-3.0.txt"
          )

          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path "package" $file))) {
              throw "Missing package file: $file"
            }
          }

          $actual = @(
            Get-ChildItem package -File |
              ForEach-Object Name |
              Sort-Object
          )
          $expectedSorted = @($expected | Sort-Object)

          if (Compare-Object $expectedSorted $actual) {
            throw "Package directory does not contain exactly the expected files."
          }

          Compress-Archive `
            -Path "package/*" `
            -DestinationPath "cpldd.zip" `
            -CompressionLevel Optimal

          python -c "import zipfile; z=zipfile.ZipFile('cpldd.zip'); expected={'cpldd.exe','cygpath.exe','ldd.exe','msys-2.0.dll','LICENSE.md','THIRD-PARTY-NOTICES.md','GPL-3.0.txt'}; actual=set(z.namelist()); assert actual == expected, f'Unexpected ZIP contents: {actual}'; print('ZIP contents verified:', sorted(actual))"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpldd-bundle-${{ github.run_number }}
          path: cpldd.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CPLDD ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: cpldd.zip
